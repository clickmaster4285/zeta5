# Zeta Techs — static Vite build served by nginx
#
# 1. On the server, build the site:
#      cd /var/www/zeta-techs && npm ci && npm run build
# 2. Copy this file to nginx sites-available and symlink sites-enabled:
#      sudo cp deploy/nginx-zetatechs.conf /etc/nginx/sites-available/zetatechs
#      sudo ln -sf /etc/nginx/sites-available/zetatechs /etc/nginx/sites-enabled/
# 3. Reload nginx:
#      sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80;
    listen [::]:80;
    server_name zetatechs.com www.zetatechs.com;

    # Point to the Vite build output (NOT .output/)
    root /var/www/zeta-techs/dist;
    index index.html;

    # Gzip static assets
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 256;

    # Cache hashed Vite assets (immutable)
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Proxy Lovable CDN media referenced by the site (/__l5e/assets-v1/...)
    location /__l5e/ {
        proxy_pass https://zeta-techs.lovable.app;
        proxy_set_header Host zeta-techs.lovable.app;
        proxy_ssl_server_name on;
        proxy_cache_valid 200 7d;
        expires 7d;
    }

    # SPA fallback — all routes serve index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Optional: redirect www → apex (uncomment if desired)
    # if ($host = www.zetatechs.com) {
    #     return 301 https://zetatechs.com$request_uri;
    # }
}

